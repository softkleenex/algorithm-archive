name: Auto Format Coding Problems

on:
  push:
    branches:
      - main
    paths:
      - 'problems/백준/**/README.md'
      - 'problems/atcoder/**/README.md'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run Formatter Script
        run: |
          python scripts/format_problems.py
          python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # README.md 도 스테이징한다. update_readme.py 가 고치는 파일인데
          # 여기서 빠뜨리면, 변경은 감지되지만 커밋할 게 없어 exit 1 로 죽는다.
          git add problems/ README.md
          # 인덱스를 본다 (git diff-index HEAD 는 스테이징 안 된 변경까지 세어
          # 커밋할 게 없는데도 분기 안으로 들어간다).
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-format problem READMEs [skip ci]"
            git push
          fi
